name: Repair checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repair-check:
    name: Repair check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
